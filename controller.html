<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITBEAT Phone Controller</title><link rel="stylesheet" href="style.css"><style>body{padding:25px}main{max-width:500px;margin:20px auto}.panel{margin:18px 0}input,select{background:#101a3b;border:1px solid #6de6ff;border-radius:10px;color:white;padding:12px;width:100%;margin:8px 0 16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls button{font-size:18px;min-height:90px}.hint{display:block;margin:12px 0}</style></head><body><main><h1 style="font-size:54px;letter-spacing:-2px">FIT<span>BEAT</span></h1><h2>Phone Controller</h2><p>Experimental phone motion assistance. The computer's camera remains the primary pose detector.</p><div class="panel"><label>Pair code from computer<input id="code" placeholder="fitbeat-xxxxxx" autocomplete="off"></label><label>Arm holding the phone<select id="arm"><option value="left">LEFT ARM</option><option value="right">RIGHT ARM</option></select></label><button class="primary" id="connect">Connect</button> <button class="secondary" id="motion">Enable Motion Sensor</button><span class="hint" id="status">Not connected</span></div><div class="panel"><h3>Manual test controls</h3><div class="controls"><button class="secondary" data-move="up">↑ UP</button><button class="secondary" data-move="side">↔ SIDE</button><button class="secondary" data-move="twist">⤾ TWIST</button><button class="secondary" data-move="down">↓ DOWN</button></div><p class="hint">For real movement recognition, use the webcam on the computer. Phone controls only assist when the camera is running.</p></div></main><script>
let peer,conn,enabled=false,last=0;const $=s=>document.querySelector(s);
function script(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)})}
$('#connect').onclick=async()=>{try{if(!window.Peer)await script('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js');peer=peer||new Peer();peer.on('open',()=>{conn=peer.connect($('#code').value.trim());conn.on('open',()=>$('#status').textContent='Connected ✓');conn.on('close',()=>$('#status').textContent='Disconnected');conn.on('error',()=>$('#status').textContent='Connection error')});peer.on('error',e=>$('#status').textContent='Pairing error: '+e.type)}catch(e){$('#status').textContent=e.message}};
$('#motion').onclick=async()=>{try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const result=await DeviceMotionEvent.requestPermission();if(result!=='granted')throw Error('Motion permission denied')}enabled=true;$('#status').textContent='Motion sensor enabled';window.addEventListener('devicemotion',e=>{const now=Date.now();if(!enabled||now-last<100||!conn?.open)return;last=now;const a=e.accelerationIncludingGravity||{};conn.send({type:'motion',arm:$('#arm').value,x:a.x||0,y:a.y||0,z:a.z||0})})}catch(e){$('#status').textContent=e.message}};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(conn?.open)conn.send({type:'move',arm:$('#arm').value,move:b.dataset.move});else $('#status').textContent='Connect first'});
</script></body></html>
